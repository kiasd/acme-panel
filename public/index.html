<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SSL 证书管理面板</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e6eb;--text2:#9ca3af;--accent:#6366f1;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--radius:10px;--font:-apple-system,BlinkMacSystemFont,'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
h1{font-size:1.3rem;font-weight:700;margin-bottom:20px}
.container{max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1rem;font-weight:600;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
input,select{flex:1;min-width:120px;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.88rem;font-family:var(--font);outline:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font);transition:opacity .2s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-accent{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:.72rem}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 8px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border)}
.badge{padding:3px 8px;border-radius:12px;font-size:.7rem;font-weight:600}
.badge-ok{background:#064e3b;color:#6ee7b7}
.badge-warn{background:#4a3500;color:#fbbf24}
.badge-err{background:#4c0519;color:#fda4af}
.toast{position:fixed;top:16px;right:16px;background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-weight:600;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}.toast.err{background:var(--red)}
.log-box{background:var(--bg);border-radius:8px;padding:12px;font-family:'SF Mono',monospace;font-size:.76rem;max-height:200px;overflow-y:auto;white-space:pre-wrap;color:var(--text2);margin-top:10px}
.tab-row{display:flex;gap:4px;margin-bottom:14px}
.tab{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.8rem;cursor:pointer;font-family:var(--font)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hidden{display:none}
.lang-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:4px 14px;font-size:.75rem;cursor:pointer;font-family:var(--font)}
.lang-btn:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body>
<div class="container">
<div style="display:flex;align-items:center;gap:12px">
<h1 data-i18n="title">🔐 SSL 证书管理面板</h1>
<button class="lang-btn" id="langSwitch" onclick="toggleLang()">EN</button>
</div>

<div class="card">
  <h2 data-i18n="dnsTitle">⚙️ DNS API 密钥</h2>
  <div id="dnsConfigList" style="margin-bottom:12px" data-i18n="loading">加载中...</div>
  <div class="form-row">
    <select id="dnsProvider" onchange="showDnsForm()"><option value="" data-i18n="addProvider">添加服务商...</option></select>
  </div>
  <div id="dnsFormFields" class="hidden">
    <div class="form-row" id="dnsFields"></div>
    <button class="btn btn-accent" onclick="saveDnsConfig()" data-i18n="saveKeys">保存密钥</button>
  </div>
</div>

<div class="card">
  <h2 data-i18n="issueTitle">🚀 申请证书</h2>
  <div class="form-row">
    <div class="tab-row" id="authTabs">
      <button class="tab active" data-auth="dns" onclick="switchAuth('dns')" data-i18n="authDns">DNS 验证</button>
      <button class="tab" data-auth="webroot" onclick="switchAuth('webroot')" data-i18n="authWebroot">Webroot</button>
    </div>
  </div>
  <div class="form-row">
    <input type="text" id="domain" data-i18n-ph="domainPh" placeholder="域名（多个用逗号分隔，将合并为一张证书）">
    <select id="siteSelect"><option value="" data-i18n="selectSite">选择站点...</option></select>
  </div>
  <div id="sanHint" class="hidden" style="margin-bottom:10px;font-size:.78rem;color:var(--yellow)" data-i18n="sanHint">📎 检测到多个域名，将合并申请为一张证书（SAN），覆盖全部域名</div>
  <div id="dnsOptions" class="form-row">
    <select id="dnsSelect"><option value="" data-i18n="selectDns">选择 DNS 服务商...</option></select>
  </div>
  <div id="webrootOptions" class="form-row hidden">
    <input type="text" id="webroot" data-i18n-ph="webrootPh" placeholder="站点根目录">
  </div>
  <div class="form-row">
    <label style="display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--text2);cursor:pointer;white-space:nowrap">
      <input type="checkbox" id="forceHttps" checked style="width:auto;min-width:0"> <span data-i18n="forceHttps">强制 HTTPS（HTTP 301 跳转）</span>
    </label>
    <button class="btn btn-accent" onclick="autoSSL()" data-i18n="applyDeploy">申请并部署</button>
    <button class="btn btn-sm" onclick="autoSSL(true)" style="background:var(--border);color:var(--text2)" data-i18n="stagingTest">Staging 测试</button>
  </div>
  <div id="autoLog" class="log-box" style="display:none"></div>
</div>

<div class="card">
  <h2 data-i18n="manageTitle">🤖 全托管</h2>
  <div id="detectStatus" style="margin-bottom:10px"><span style="color:var(--text2)" data-i18n="detectHint">点击检测缺失 SSL 的域名</span></div>
  <div class="form-row">
    <button class="btn btn-accent" onclick="runDetect()" data-i18n="scan">🔍 扫描</button>
    <button class="btn btn-green" id="btnApplyAll" onclick="applyAll()" style="display:none" data-i18n="applyAll">🚀 一键全自动申请</button>
  </div>
  <div id="detectResults" style="margin-top:10px;max-height:200px;overflow-y:auto"></div>
  <div id="detectLog" class="log-box" style="display:none"></div>
</div>

<div class="card">
  <h2 data-i18n="renewTitle">🔄 自动续期</h2>
  <div id="renewStatus" style="margin-bottom:10px" data-i18n="loading">加载中...</div>
  <div class="form-row">
    <input type="text" id="cronSchedule" data-i18n-ph="cronPh" placeholder="0 3 * * * (每天凌晨3点)">
    <button class="btn btn-green" onclick="setupAR(true)" data-i18n="enable">开启</button>
    <button class="btn btn-red btn-sm" onclick="setupAR(false)" data-i18n="disable">关闭</button>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <h2 data-i18n="certsTitle">📜 证书</h2>
    <button class="btn btn-sm" style="margin-bottom:10px" onclick="loadCerts()" data-i18n="refresh">刷新</button>
    <button class="btn btn-green btn-sm" style="margin-bottom:10px;margin-left:6px" onclick="renewAll()" data-i18n="renewAll">续签全部</button>
    <button class="btn btn-red btn-sm" style="margin-bottom:10px;margin-left:6px" onclick="doCleanup()" data-i18n="cleanup">🧹 清理</button>
    <div id="certList" data-i18n="loading">加载中...</div>
  </div>
  <div class="card">
    <h2 data-i18n="sitesTitle">🌐 站点</h2>
    <button class="btn btn-sm" style="margin-bottom:10px" onclick="loadSites()" data-i18n="refresh">刷新</button>
    <div id="siteList" data-i18n="loading">加载中...</div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>
<script>
// ===== i18n =====
const I18N = {
  zh: {
    title: '🔐 SSL 证书管理面板', dnsTitle: '⚙️ DNS API 密钥', issueTitle: '🚀 申请证书',
    manageTitle: '🤖 全托管', renewTitle: '🔄 自动续期', certsTitle: '📜 证书', sitesTitle: '🌐 站点',
    loading: '加载中...', addProvider: '添加服务商...', saveKeys: '保存密钥',
    authDns: 'DNS 验证', authWebroot: 'Webroot', domainPh: '域名（多个用逗号分隔，将合并为一张证书）',
    selectSite: '选择站点...', sanHint: '📎 检测到多个域名，将合并申请为一张证书（SAN），覆盖全部域名',
    selectDns: '选择 DNS 服务商...', webrootPh: '站点根目录', forceHttps: '强制 HTTPS（HTTP 301 跳转）',
    applyDeploy: '申请并部署', stagingTest: 'Staging 测试', detectHint: '点击检测缺失 SSL 的域名',
    scan: '🔍 扫描', applyAll: '🚀 一键全自动申请', cronPh: '0 3 * * * (每天凌晨3点)',
    enable: '开启', disable: '关闭', refresh: '刷新', renewAll: '续签全部', cleanup: '🧹 清理',
    noDnsCfg: '未配置 DNS 密钥 — 仅能用 Webroot 方式申请', saved: '已保存', deleted: '已删除',
    noCerts: '暂无证书', noSites: '无站点', thDomain: '域名', thDays: '剩余', thActions: '操作', thSsl: 'SSL', thRoot: '根目录',
    certEnabled: '🔒 已启用', certDisabled: '未启用', daysUnit: '天', renew: '续签', deploy: '部署', delete: '删除',
    delDnsCfm: (p) => `删除 ${p} 的密钥？`, dnsNeed: '请选择 DNS 服务商', webrootNeed: '请填写站点根目录',
    domainSiteNeed: '请填写域名并选择站点', applying: '正在申请...', applyStart: '⏳ 申请中...\n',
    applyOk: (ds) => `✅ 申请成功（${ds}）`, deployOk: (fh) => `✅ 已部署 Nginx（${fh ? '含强制HTTPS跳转' : '未强制跳转'}）`,
    complete: '完成！', fail: '失败', renewAllCfm: '续签所有证书？', renewingAll: '续签中...',
    renewing: (d) => `续签 ${d}...`, renewed: (d) => `${d} 续签完成`, deployPrompt: (d) => `部署 ${d} 到哪个站点？`,
    renewOn: '✅ 已开启', renewOff: '⏸ 未开启', renewEnabled: '自动续期已开启', renewDisabled: '自动续期已关闭', renewStatusLoadFail: '加载失败',
    cleanupCfm: '将扫描宝塔证书目录和acme.sh，清除无站点/已吊销的证书。\n\n⚠️ 此操作不可撤销，确定继续？',
    cleaning: '扫描中...', cleanedCount: (n) => `已清理 ${n} 个证书`, cleanDone: (n, m) => `清理完成: ${n} 个\n\n${m || '无需清理'}`,
    detecting: '⏳ 扫描中...', detectFailed: '检测失败: ', scanSummary: (s, c, n, d) => `站点:${s} | 已有证书:${c} | 缺失SSL:${n} | ${d} 个已覆盖`,
    needDnsWarn: '⚠️ 请先配置 DNS API 密钥', coveredCount: (n) => `✅ 已覆盖 ${n} 个域名`,
    needCount: (n) => `❌ 需申请 ${n} 个：`, needItem: (d, s, needsDNS, webroot) => `🔴 ${d} → ${s} ${needsDNS ? '(需DNS)' : '(webroot:' + (webroot || '') + ')'}`,
    applyAllCfm: '确认自动申请所有缺失 SSL 的域名？此操作可能持续数分钟',
    applyingAll: '⏳ 开始批量申请...\n', applyDoneCount: (n, t) => `完成: ${n}/${t} 成功\n`,
    applyItem: (x) => `  ${x.status === 'ok' ? '✅' : '❌'} ${(x.domains || []).join(', ')}${x.error ? ' — ' + x.error : ''}\n`,
    appliedCount: (n) => `${n} 个站点 SSL 已部署`,
    deleteCfm: (d, san) => `删除证书 ${d}${san ? '（含 ' + san + '）' : ''}？\n\n将删除 acme.sh 与宝塔证书目录中的证书文件。\n若站点仍引用该证书，会提示并要求确认关闭站点 SSL。`,
    deleteForceCfm: (s) => `证书仍被站点引用：${s}\n\n强制删除将关闭这些站点的 SSL（回退为 HTTP 访问），宝塔面板同步显示未开启。\n继续？`,
    deletedCert: '已删除证书', deleteFailed: '删除失败', delSslClosed: '已删除证书，站点 SSL 已关闭',
    langSwitched: '语言已切换',
  },
  en: {
    title: '🔐 SSL Certificate Manager', dnsTitle: '⚙️ DNS API Keys', issueTitle: '🚀 Issue Certificate',
    manageTitle: '🤖 Auto Manage', renewTitle: '🔄 Auto Renew', certsTitle: '📜 Certificates', sitesTitle: '🌐 Sites',
    loading: 'Loading...', addProvider: 'Add provider...', saveKeys: 'Save Keys',
    authDns: 'DNS', authWebroot: 'Webroot', domainPh: 'Domain (comma-separated for a combined SAN cert)',
    selectSite: 'Select site...', sanHint: '📎 Multiple domains detected — will be issued as one combined SAN certificate',
    selectDns: 'Select DNS provider...', webrootPh: 'Site root directory', forceHttps: 'Force HTTPS (HTTP 301 redirect)',
    applyDeploy: 'Issue & Deploy', stagingTest: 'Staging Test', detectHint: 'Click to detect domains missing SSL',
    scan: '🔍 Scan', applyAll: '🚀 Auto-issue All', cronPh: '0 3 * * * (daily 3am)',
    enable: 'Enable', disable: 'Disable', refresh: 'Refresh', renewAll: 'Renew All', cleanup: '🧹 Cleanup',
    noDnsCfg: 'No DNS keys configured — Webroot mode only', saved: 'Saved', deleted: 'Deleted',
    noCerts: 'No certificates', noSites: 'No sites', thDomain: 'Domain', thDays: 'Days Left', thActions: 'Actions', thSsl: 'SSL', thRoot: 'Root',
    certEnabled: '🔒 Enabled', certDisabled: 'Not enabled', daysUnit: 'd', renew: 'Renew', deploy: 'Deploy', delete: 'Delete',
    delDnsCfm: (p) => `Delete keys for ${p}?`, dnsNeed: 'Please select a DNS provider', webrootNeed: 'Please enter the site root directory',
    domainSiteNeed: 'Please enter domain and select a site', applying: 'Issuing...', applyStart: '⏳ Issuing...\n',
    applyOk: (ds) => `✅ Issued (${ds})`, deployOk: (fh) => `✅ Deployed to Nginx (${fh ? 'with forced HTTPS' : 'no forced redirect'})`,
    complete: 'Done!', fail: 'Failed', renewAllCfm: 'Renew all certificates?', renewingAll: 'Renewing...',
    renewing: (d) => `Renewing ${d}...`, renewed: (d) => `${d} renewed`, deployPrompt: (d) => `Deploy ${d} to which site?`,
    renewOn: '✅ On', renewOff: '⏸ Off', renewEnabled: 'Auto-renew enabled', renewDisabled: 'Auto-renew disabled', renewStatusLoadFail: 'Failed to load',
    cleanupCfm: 'Scan BaoTa cert dir and acme.sh, remove certificates without sites or revoked.\n\n⚠️ This cannot be undone. Continue?',
    cleaning: 'Scanning...', cleanedCount: (n) => `Cleaned ${n} certificates`, cleanDone: (n, m) => `Cleanup done: ${n}\n\n${m || 'Nothing to clean'}`,
    detecting: '⏳ Scanning...', detectFailed: 'Detect failed: ', scanSummary: (s, c, n, d) => `Sites:${s} | Certs:${c} | Missing SSL:${n} | ${d} covered`,
    needDnsWarn: '⚠️ Please configure DNS API keys first', coveredCount: (n) => `✅ ${n} domains covered`,
    needCount: (n) => `❌ ${n} to issue:`, needItem: (d, s, needsDNS, webroot) => `🔴 ${d} → ${s} ${needsDNS ? '(needs DNS)' : '(webroot:' + (webroot || '') + ')'}`,
    applyAllCfm: 'Auto-issue SSL for all domains missing it? This may take minutes',
    applyingAll: '⏳ Starting batch issue...\n', applyDoneCount: (n, t) => `Done: ${n}/${t} succeeded\n`,
    applyItem: (x) => `  ${x.status === 'ok' ? '✅' : '❌'} ${(x.domains || []).join(', ')}${x.error ? ' — ' + x.error : ''}\n`,
    appliedCount: (n) => `${n} site(s) SSL deployed`,
    deleteCfm: (d, san) => `Delete certificate ${d}${san ? ' (incl. ' + san + ')' : ''}?\n\nRemoves the certificate files from acme.sh and BaoTa cert dir.\nIf a site still references it, you will be asked to close site SSL.`,
    deleteForceCfm: (s) => `Certificate is still referenced by sites: ${s}\n\nForcing deletion will close SSL on those sites (fall back to HTTP). BaoTa panel reflects this.\nContinue?`,
    deletedCert: 'Certificate deleted', deleteFailed: 'Delete failed', delSslClosed: 'Certificate deleted, site SSL closed',
    langSwitched: 'Language switched',
  }
};

let lang = localStorage.getItem('acme-panel-lang') || 'zh';
const t = (k, ...args) => {
  const fn = (I18N[lang] && I18N[lang][k]) ?? I18N.zh[k];
  return typeof fn === 'function' ? fn(...args) : (fn ?? k);
};
function toggleLang(){ lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('acme-panel-lang', lang); applyLang(); toast(t('langSwitched')); }
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('#langSwitch').textContent = lang === 'zh' ? 'EN' : '中文';
  loadDnsConfig(); loadCerts(); loadSites(); loadRenewStatus(); runDetect();
}

// ===== 基础 =====
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let authMode='dns';

function toast(m,e){const t=$('#toast');t.textContent=m;t.className='toast'+(e?' err':'')+' show';setTimeout(()=>t.classList.remove('show'),3000)}
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});return r.json()}

function switchAuth(m){authMode=m;$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.auth===m));$('#dnsOptions').classList.toggle('hidden',m!=='dns');$('#webrootOptions').classList.toggle('hidden',m!=='webroot')}

// ===== DNS 配置 =====
async function loadDnsConfig(){
  const cfg=await api('/api/dns-config'),provs=await api('/api/dns-providers');
  let h='';for(const[k]of Object.entries(cfg)){const p=provs[k]||{name:k};h+=`<span style="display:inline-flex;align-items:center;gap:8px;margin:4px 8px 4px 0;background:var(--bg);border-radius:8px;padding:6px 12px">🔑 ${p.name} <button class="btn btn-red btn-sm" onclick="delDns('${k}')">×</button></span>`}
  if(!h)h='<span style="color:var(--text2)">'+t('noDnsCfg')+'</span>';
  $('#dnsConfigList').innerHTML=h;
  $('#dnsProvider').innerHTML='<option value="">'+t('addProvider')+'</option>'+Object.entries(provs).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
  $('#dnsSelect').innerHTML='<option value="">'+t('selectDns')+'</option>'+Object.entries(provs).filter(([k])=>cfg[k]).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
}

function showDnsForm(){const p=$('#dnsProvider').value;if(!p)return;api('/api/dns-providers').then(provs=>{const dp=provs[p];$('#dnsFormFields').classList.remove('hidden');$('#dnsFields').innerHTML=dp.env.split(',').map(k=>`<input type="${k.includes('Key')||k.includes('Token')?'password':'text'}" id="dns_${k}" placeholder="${k}">`).join('')})}
async function saveDnsConfig(){const p=$('#dnsProvider').value;if(!p)return;const provs=await api('/api/dns-providers'),dp=provs[p],cred={};dp.env.split(',').forEach(k=>{const v=$('#dns_'+k).value;cred[k]=v});const r=await api('/api/dns-config',{method:'POST',body:{provider:p,credentials:cred}});if(r.ok){toast(t('saved'));loadDnsConfig();$('#dnsFormFields').classList.add('hidden')}else toast(r.error,true)}
async function delDns(p){if(!confirm(t('delDnsCfm',p)))return;await api('/api/dns-config/'+p,{method:'DELETE'});toast(t('deleted'));loadDnsConfig()}

// ===== 证书 =====
let certCache = [];
async function loadCerts(){try{const c=await api('/api/certs');certCache=c;if(!c.length){$('#certList').innerHTML='<span style="color:var(--text2)">'+t('noCerts')+'</span>';return}$('#certList').innerHTML=`<table><tr><th>${t('thDomain')}</th><th>${t('thDays')}</th><th>${t('thActions')}</th></tr>${c.map(x=>`<tr><td>${x.domain}${(x.sanDomains&&x.sanDomains.length)?'<br><span style="font-size:.65rem;color:var(--text2)">+ '+x.sanDomains.join(' ')+'</span>':''}</td><td><span class="badge ${x.remainingDays>7?'badge-ok':x.remainingDays>0?'badge-warn':'badge-err'}">${x.remainingDays}${t('daysUnit')}</span></td><td><button class="btn btn-green btn-sm" onclick="renewOne('${x.domain}')">${t('renew')}</button><button class="btn btn-sm" style="background:var(--border);color:var(--text2);margin-left:4px" onclick="deployCert('${x.domain}','${x.certPath}','${x.keyPath}')">${t('deploy')}</button><button class="btn btn-red btn-sm" style="margin-left:4px" onclick="deleteCert('${x.domain}')">${t('delete')}</button></td></tr>`).join('')}</table>`}catch(e){toast(e.message,true)}}

// ===== 站点 =====
async function loadSites(){try{const s=await api('/api/sites');if(!s.length){$('#siteList').innerHTML='<span style="color:var(--text2)">'+t('noSites')+'</span>';return}$('#siteList').innerHTML=`<table><tr><th>${t('thDomain')}</th><th>${t('thSsl')}</th><th>${t('thRoot')}</th></tr>${s.map(x=>`<tr><td>${x.name}</td><td><span class="badge ${x.hasSSL?'badge-ok':'badge-none'}">${x.hasSSL?t('certEnabled'):t('certDisabled')}</span></td><td><code style="font-size:.72rem;color:var(--text2)">${x.webroot||'-'}</code></td></tr>`).join('')}</table>`;$('#siteSelect').innerHTML='<option value="">'+t('selectSite')+'</option>'+s.map(x=>`<option value="${x.configFile}" data-webroot="${x.webroot||''}">${x.name} ${x.webroot?' ['+x.webroot+']':''}</option>`).join('')}catch(e){toast(e.message,true)}}

// ===== 申请 =====
async function autoSSL(test){const raw=$('#domain').value.trim();const domains=raw.split(/[,\s]+/).filter(Boolean);const siteName=$('#siteSelect').value;if(!domains.length||!siteName)return toast(t('domainSiteNeed'),true);const log=$('#autoLog');log.style.display='block';log.textContent=t('applyStart');toast(t('applying'));
const body={domains,siteName,keylength:'ec-256',forceHttps:$('#forceHttps').checked};
if(authMode==='dns'){const d=$('#dnsSelect').value;if(!d)return toast(t('dnsNeed'),true);body.dns=d}else{body.webroot=$('#webroot').value.trim()||$('#siteSelect').selectedOptions[0]?.dataset.webroot||'';if(!body.webroot)return toast(t('webrootNeed'),true)}
try{const ep=test?'/api/issue-test':'/api/auto-ssl';const r=await api(ep,{method:'POST',body});if(r.ok){log.textContent+=t('applyOk',(r.issue.domains||[r.issue.domain]).join(', '))+'\n'+t('deployOk',r.deploy.forceHttps)+'\n';toast(t('complete'));loadCerts();loadSites()}else{log.textContent+='❌ '+(r.error||t('fail'))+'\n';toast(r.error||t('fail'),true)}}catch(e){log.textContent+='❌ '+e.message+'\n';toast(e.message,true)}}

// ===== 删除证书 =====
async function deleteCert(d){const c=certCache.find(x=>x.domain===d);const san=(c?.sanDomains||[]).join(', ');
if(!confirm(t('deleteCfm',d,san)))return;
const del=async force=>api('/api/certs/'+encodeURIComponent(d),{method:'DELETE',body:force?{force:true}:{}});
try{
  const r=await del(false);
  if(r.ok){toast(t('deletedCert'));loadCerts();loadSites();return}
  if(r.blockedBy&&r.blockedBy.length){
    if(confirm(t('deleteForceCfm',r.blockedBy.join(', ')))){
      const r2=await del(true);
      if(r2.ok){toast(t('delSslClosed'));loadCerts();loadSites()}else toast(r2.error||t('deleteFailed'),true)
    }
    return;
  }
  toast(r.error||t('deleteFailed'),true)
}catch(e){toast(e.message,true)}}

async function updateSanHint(){const n=$('#domain').value.trim().split(/[,\s]+/).filter(Boolean).length;$('#sanHint').classList.toggle('hidden',n<2)}

// ===== 续签 =====
async function renewAll(){if(!confirm(t('renewAllCfm')))return;toast(t('renewingAll'));try{await api('/api/renew',{method:'POST',body:{}});toast(t('complete'));loadCerts()}catch(e){toast(e.message,true)}}
async function renewOne(d){toast(t('renewing',d));try{await api('/api/renew',{method:'POST',body:{domain:d}});toast(t('renewed',d));loadCerts()}catch(e){toast(e.message,true)}}
async function deployCert(domain,cp,kp){const s=prompt(t('deployPrompt',domain),domain);if(!s)return;try{await api('/api/deploy',{method:'POST',body:{domain,certPath:cp,keyPath:kp,siteName:s}});toast(t('complete'));loadSites()}catch(e){toast(e.message,true)}}

// ===== 自动续期 =====
async function loadRenewStatus(){try{const r=await api('/api/auto-renew-status');$('#renewStatus').innerHTML=`<span class="badge ${r.enabled?'badge-ok':'badge-none'}">${r.enabled?t('renewOn'):t('renewOff')}</span> <code style="font-size:.72rem;color:var(--text2)">${r.crontab||'—'}</code>`}catch(e){$('#renewStatus').textContent=t('renewStatusLoadFail')}}
async function setupAR(enable){const sch=$('#cronSchedule').value.trim()||'0 3 * * *';try{const r=await api('/api/auto-renew',{method:'POST',body:{enable,schedule:sch}});toast(r.enabled?t('renewEnabled'):t('renewDisabled'));loadRenewStatus()}catch(e){toast(e.message,true)}}

// ===== 清理 =====
async function doCleanup(){if(!confirm(t('cleanupCfm')))return;toast(t('cleaning'));
try{const r=await api('/api/cleanup',{method:'POST',body:{dryRun:false}});const m=r.cleaned.map(x=>`🗑 ${x.path} (${x.reason})`).join('\n');toast(t('cleanedCount',r.count));alert(t('cleanDone',r.count,m));loadCerts();runDetect()}catch(e){toast(e.message,true)}}

// ===== 全托管 =====
async function runDetect(){const s=$('#detectStatus');s.innerHTML=t('detecting');$('#detectResults').innerHTML='';
try{const r=await api('/api/auto-detect');
s.innerHTML=t('scanSummary',r.totalSites,r.totalCerts,r.needSSL,r.done);
if(!r.hasDNS&&r.needSSL)s.innerHTML+='<br><span style="color:var(--yellow)">'+t('needDnsWarn')+'</span>';
if(r.needSSL>0&&r.hasDNS)$('#btnApplyAll').style.display='';
else $('#btnApplyAll').style.display='none';
let h='';
if(r.list.done.length)h+=`<div style="margin-bottom:8px;font-size:.8rem;color:var(--green)">${t('coveredCount',r.list.done.length)}</div>`;
if(r.list.needSSL.length)h+=`<div style="margin-bottom:8px;font-size:.8rem;color:var(--red)">${t('needCount',r.list.needSSL.length)}</div>`+r.list.needSSL.map(x=>`<div style="margin:2px 0;padding:6px 10px;background:var(--bg);border-radius:6px;font-size:.78rem">${t('needItem',x.domain,x.site,x.needsDNS,x.webroot)}</div>`).join('');
$('#detectResults').innerHTML=h}catch(e){s.innerHTML='<span style="color:var(--red)">'+t('detectFailed')+e.message+'</span>'}}

async function applyAll(){if(!confirm(t('applyAllCfm')))return;
const log=$('#detectLog');log.style.display='block';log.textContent=t('applyingAll');$('#btnApplyAll').disabled=true;
try{const r=await api('/api/auto-apply-all',{method:'POST'});
log.textContent+=t('applyDoneCount',r.ok,r.total);
r.results.forEach(x=>{log.textContent+=t('applyItem',x)});
toast(t('appliedCount',r.ok));loadCerts();loadSites();runDetect()}catch(e){log.textContent+='❌ '+e.message;toast(e.message,true)}
$('#btnApplyAll').disabled=false}

// ===== 启动 =====
(async()=>{await api('/api/init');applyLang();$('#domain').addEventListener('input',updateSanHint);switchAuth('dns')})();
</script>
</body>
</html>
